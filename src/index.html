<!--HEAD-->
<title>Recoil Climb</title>
<meta name="theme-color" content="#07080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #07080b;
    --rock: #1b1e24;
    --snow: #e3e6e9;
    --dim: #7a808a;
    --hood: #e3e6e9;
    --ember: #d9dde2;
    --moss: #6ff7ff;
    --danger: #ff3040;
    --sky: #6ff7ff;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--night); color: var(--snow); overflow: hidden; }
  body { font-family: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', monospace; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
  #game { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; display: block; }
  #ui { position: fixed; left: 0; top: 0; pointer-events: none; }
  .btn-pause { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 8px; width: 40px; height: 40px; border: 1px solid #5b616d; background: rgba(7,8,11,.6); color: var(--snow); font: inherit; font-size: 16px; line-height: 1; z-index: 5; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); background: rgba(7,8,11,.86); z-index: 10; overflow-y: auto; touch-action: auto; }
  .panel { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
  .logo { margin: 0; font-size: 40px; line-height: 1.05; letter-spacing: .12em; color: var(--hood); text-shadow: -2px 0 rgba(255,48,64,.85), 2px 0 rgba(63,216,255,.7); text-wrap: balance; animation: flicker 6s infinite steps(1); }
  @keyframes flicker { 0%, 100% { opacity: 1; } 91% { opacity: 1; } 92% { opacity: .35; transform: translateX(2px); } 93% { opacity: 1; transform: none; } 96% { opacity: .7; } 97% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  .overlay::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
  .overlay::after { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.7) 100%); }
  .panel { position: relative; z-index: 1; }
  .warplist { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; }
  button.act.warp { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; padding: 10px 12px; }
  button.act.warp .h { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .loglist { display: flex; flex-direction: column; gap: 12px; text-align: left; max-height: 55vh; overflow-y: auto; }
  .log { border-left: 2px solid #ff3fa4; padding: 2px 0 2px 10px; }
  .logno { font-size: 11px; color: #ff3fa4; letter-spacing: .2em; }
  .logtext { font-size: 14px; line-height: 1.7; white-space: pre-line; color: #cfd3d8; }
  .log.missing { border-left-color: #3a3f47; }
  .log.missing .logno { color: #5b616d; }
  .log.missing .logtext { color: #5b616d; letter-spacing: .2em; }
  .rule { height: 1px; background: linear-gradient(90deg, transparent, var(--danger), transparent); border: 0; margin: 0; }
  .logo.heaven { color: #fff8e8; text-shadow: 0 0 12px #e6dcc4, 3px 3px 0 #3d8f99; }
  .sub { margin: 0; color: var(--dim); font-size: 13px; letter-spacing: .2em; }
  .howto { margin: 0; padding: 12px 14px; list-style: none; text-align: left; border: 1px solid #3d8f99; background: rgba(10,12,16,.8); display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; }
  .howto b { color: var(--hood); font-weight: normal; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button.act { font: inherit; font-size: 18px; padding: 12px 8px; border: 1px solid #5b616d; background: var(--rock); color: var(--snow); box-shadow: 3px 3px 0 #000; cursor: pointer; letter-spacing: .08em; }
  button.act.primary { background: var(--ember); color: var(--night); border-color: var(--ember); }
  button.act:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
  button.act:disabled { opacity: .35; }
  button:focus-visible { outline: 2px dashed var(--hood); outline-offset: 3px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 0; font-size: 16px; text-align: left; font-variant-numeric: tabular-nums; }
  .stats dt { color: var(--dim); }
  .stats dd { margin: 0; text-align: right; }
  .small { font-size: 12px; color: var(--dim); margin: 0; line-height: 1.6; }
  .dbg .panel { max-width: 400px; gap: 10px; }
  .dbg h3 { margin: 4px 0 0; font-size: 12px; font-weight: normal; color: #ffb347; letter-spacing: .2em; text-align: left; }
  .dbg .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .dbg .grid.g3 { grid-template-columns: repeat(3, 1fr); }
  .dbg button.act { font-size: 14px; padding: 8px 4px; box-shadow: 2px 2px 0 #000; }
  .dbg button.act.on { background: #ffb347; color: var(--night); border-color: #ffb347; }
  .dbg .warplist { max-height: 34vh; }
  .dbg .coord { display: flex; gap: 6px; align-items: center; }
  .dbg .coord input { width: 0; flex: 1; font: inherit; font-size: 16px; padding: 8px; background: #0a0c10; color: var(--snow); border: 1px solid #5b616d; }
  .dbg .coord button { flex: 1.2; }
  .dbg .tag { font-size: 11px; color: #ffb347; margin-right: 6px; }
  .hint { font-size: 14px; color: var(--sky); margin: 0; line-height: 1.6; }
</style>
<!--/HEAD-->
<canvas id="game" width="144" height="256"></canvas>
<canvas id="ui"></canvas>
<button class="btn-pause" id="btnPause" aria-label="ポーズ" hidden>II</button>

<div class="overlay" id="scrTitle">
  <div class="panel">
    <div>
      <h1 class="logo" style="margin-bottom:28px">RECOIL<br>CLIMB</h1>
    </div>
    <div class="row">
      <button class="act" id="btnNew">はじめから</button>
      <button class="act primary" id="btnCont">続きから</button>
    </div>
    <p class="small" id="bestLine"></p>
  </div>
</div>

<div class="overlay" id="scrPause" hidden>
  <div class="panel">
    <h2 class="logo" style="font-size:28px">――静止</h2>
    <dl class="stats" id="pauseStats"></dl>
    <p class="small" id="pauseAbil"></p>
    <div class="row">
      <button class="act" id="btnSound">音　ON</button>
      <button class="act" id="btnHaptics">振動　ON</button>
    </div>
    <div class="row">
      <button class="act" id="btnWarp">転移</button>
      <button class="act" id="btnLogs">記録</button>
    </div>
    <button class="act" id="btnTitle">タイトルへ</button>
    <button class="act primary" id="btnResume">戻る</button>
  </div>
</div>

<div class="overlay" id="scrItem" hidden>
  <div class="panel">
    <p class="sub" id="itemSub">――何かを、拾った。</p>
    <canvas id="itemIcon" width="64" height="64" style="width:96px;height:96px;margin:0 auto;image-rendering:pixelated;border:1px solid #3d8f99;background:#0a0c10"></canvas>
    <h2 class="logo" style="font-size:30px" id="itemName"></h2>
    <p style="margin:0;font-size:16px;line-height:1.7;white-space:pre-line" id="itemDesc"></p>
    <p class="small" id="itemAbil" style="white-space:pre-line"></p>
    <button class="act primary" id="btnItemOk">受け入れる</button>
  </div>
</div>

<div class="overlay" id="scrWarp" hidden>
  <div class="panel">
    <h2 class="logo" style="font-size:26px">転移</h2>
    <p class="sub">起動した中継点へ移る。</p>
    <hr class="rule">
    <div id="warpList" class="warplist"></div>
    <button class="act primary" id="btnWarpBack">戻る</button>
  </div>
</div>

<div class="overlay dbg" id="scrDebug" hidden>
  <div class="panel">
    <h2 class="logo" style="font-size:24px">DEBUG</h2>
    <p class="small" id="dbgPos"></p>
    <h3>道具</h3>
    <div class="grid" id="dbgAmmo"></div>
    <div class="grid g3" id="dbgFlags"></div>
    <h3>転移</h3>
    <div class="coord">
      <input id="dbgX" type="number" inputmode="numeric" placeholder="x" aria-label="x">
      <input id="dbgY" type="number" inputmode="numeric" placeholder="y" aria-label="y">
      <button class="act" id="dbgGo">座標へ</button>
    </div>
    <div id="dbgList" class="warplist"></div>
    <h3>テレメトリ</h3>
    <p class="small" id="dbgTm" style="text-align:left;white-space:pre-line"></p>
    <div class="grid g3">
      <button class="act" id="dbgTmCopy">JSONをコピー</button>
      <button class="act" id="dbgTmSave">保存</button>
      <button class="act" id="dbgTmClear">消去</button>
    </div>
    <h3>世界</h3>
    <div class="grid g3">
      <button class="act" id="dbgRelays">中継点を全起動</button>
      <button class="act" id="dbgShell">殻を崩す</button>
      <button class="act" id="dbgRefill">弾を満たす</button>
    </div>
    <button class="act primary" id="dbgBack">戻る</button>
  </div>
</div>

<div class="overlay" id="scrLogs" hidden>
  <div class="panel">
    <h2 class="logo" style="font-size:26px">記録</h2>
    <hr class="rule">
    <div id="logList" class="loglist"></div>
    <button class="act primary" id="btnLogsBack">戻る</button>
  </div>
</div>

<div class="overlay" id="scrClear" hidden>
  <div class="panel">
    <h2 class="logo" style="font-size:30px">UPPERMOST</h2>
    <p class="sub">最上層。…ここで、終わりのはずだった。</p>
    <dl class="stats" id="clearStats"></dl>
    <p class="hint">天井の亀裂から、見たことのない光が漏れている。</p>
    <button class="act primary" id="btnExplore">上へ</button>
  </div>
</div>

<div class="overlay" id="scrHeaven" hidden>
  <div class="panel">
    <h2 class="logo heaven" style="font-size:34px">OUTSIDE</h2>
    <p class="sub" id="heavenSub">外だ。誰も、ここまでは来なかった。</p>
    <dl class="stats" id="heavenStats"></dl>
    <p class="hint" id="heavenHint"></p>
    <button class="act primary" id="btnHeavenTitle">探索を続ける</button>
  </div>
</div>
<!--SCRIPTS-->
